  <circle cx="64" cy="12" r="8" fill="url(#antenna)"/>
  <circle cx="61" cy="9" r="2.5" fill="#ffffff" opacity="0.9"/>

  <!-- 耳朵 -->
  <ellipse cx="22" cy="60" rx="11" ry="16" fill="#3b9ef0"/>
  <ellipse cx="106" cy="60" rx="11" ry="16" fill="#3b9ef0"/>

  <!-- 头部 -->
  <ellipse cx="64" cy="66" rx="42" ry="40" fill="url(#skin)"/>

  <!-- 眼睛 -->
  <ellipse cx="49" cy="64" rx="11" ry="15" fill="#0f172a"/>
  <ellipse cx="79" cy="64" rx="11" ry="15" fill="#0f172a"/>
  <circle cx="53" cy="59" r="3.5" fill="#ffffff"/>
  <circle cx="83" cy="59" r="3.5" fill="#ffffff"/>

  <!-- 微笑 -->
  <path d="M 52 86 Q 64 98 76 86" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>

  <!-- 腮红 -->
  <ellipse cx="38" cy="78" rx="6" ry="3.5" fill="#bae0ff" opacity="0.85"/>
  <ellipse cx="90" cy="78" rx="6" ry="3.5" fill="#bae0ff" opacity="0.85"/>
